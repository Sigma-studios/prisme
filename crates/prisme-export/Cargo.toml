[package]
name = "prisme-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prisme-color = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Palette quantization (MIT/Apache, pure Rust). `threads` is enabled on native only (below).
quantette = { version = "0.6", default-features = false, features = ["kmeans"] }
palette = { version = "0.7.6", default-features = false, features = ["libm"] }
# Pure-Rust building blocks for chunk writing and the wasm PNG writer.
crc32fast = "1.4"
miniz_oxide = "0.8"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

# oxipng depends on libdeflate (C) which does not build for wasm32-unknown-unknown with a stock
# toolchain, so it is native-only; wasm uses the built-in pure-Rust writer (src/writer.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxipng = { version = "10.2", default-features = false, features = ["zopfli", "parallel"] }
rayon = { workspace = true }
quantette = { version = "0.6", default-features = false, features = ["kmeans", "threads"] }

[dev-dependencies]
png = "0.18"
