[package]
name = "prisme-text"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prisme-core = { workspace = true }
prisme-color = { workspace = true }
log = { workspace = true }
fontdb = { version = "0.23", default-features = false, features = ["std"] }
rustybuzz = "0.20"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
lyon_tessellation = "1"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
rayon = { workspace = true }

# prisme-core pulls ahash -> getrandom 0.3, which needs its JS backend on the web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
