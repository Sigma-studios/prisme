[package]
name = "prisme-vector"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prisme-core = { workspace = true }
prisme-color = { workspace = true }
log = { workspace = true }
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images", "system-fonts", "memmap-fonts"] }
rayon = { workspace = true }

# prisme-core pulls ahash -> getrandom 0.3, which needs its JS backend on the web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
