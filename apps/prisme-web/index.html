<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prisme</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <!-- Job worker: loads the same wasm (see worker.js / prisme-platform worker.rs). -->
  <link data-trunk rel="copy-file" href="worker.js" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #18191c; color: #dee0e6; font-family: system-ui, sans-serif; }
    #prisme-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading, #no-webgpu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    #loading h1 { color: #6e8cff; font-weight: 600; letter-spacing: 0.04em; }
    /* Why Prisme can't start (apps/prisme-web/src/lib.rs, mod help). */
    #loading.help { text-align: left; width: min(40rem, calc(100% - 3rem)); line-height: 1.55; }
    #loading.help h1 { text-align: center; }
    #loading.help li { margin: 0.5em 0; }
    #loading.help code { background: #26282e; padding: 0.1em 0.35em; border-radius: 4px; white-space: nowrap; }
    #loading.help button.addr { font-family: ui-monospace, Menlo, monospace; font-size: 0.85em; color: #dee0e6; background: #26282e; border: 1px solid #4a4e58; border-radius: 4px; padding: 0.05em 0.4em; cursor: copy; white-space: nowrap; }
    #loading.help button.addr:hover { border-color: #6e8cff; }
    #loading.help button.addr[data-copied]::after { content: " ✓ copied"; color: #7fd18b; font-family: system-ui, sans-serif; }
    #loading.help a { color: #6e8cff; }
    #loading.help .small { font-size: 0.85em; color: #9a9ea8; }
  </style>
</head>
<body>
  <canvas id="prisme-canvas"></canvas>
  <div id="loading"><h1>◆ Prisme</h1><p id="no-webgpu">Loading…</p></div>
</body>
</html>
