[package]
name = "prisme-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "prisme"
path = "src/main.rs"

[dependencies]
prisme-ui = { workspace = true }
prisme-io = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
env_logger = "0.11"
log = { workspace = true }
