name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers pkg-config
      - uses: Swatinem/rust-cache@v2
      # GPU tests skip themselves when no adapter is available (lavapipe on Linux provides one).
      - run: cargo test --workspace --release
      - run: cargo clippy --workspace
      - run: cargo build --release -p prisme-desktop
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude prisme-desktop --target wasm32-unknown-unknown
      - run: cargo install trunk --locked
      - run: cd apps/prisme-web && trunk build --release
      - uses: actions/upload-artifact@v4
        with: { name: prisme-web, path: apps/prisme-web/dist }
